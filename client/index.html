<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
    #app { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; }

    #loading-screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0a0a12; color: #eee;
      font-family: system-ui, sans-serif; z-index: 50;
    }
    #loading-screen.hidden { display: none; }
    #loading-status { margin-top: 12px; font-size: 14px; color: #999; }

    #hud { position: absolute; top: 12px; left: 12px; color: #fff; font-family: system-ui, sans-serif;
      font-size: 13px; text-shadow: 0 1px 2px #000; z-index: 10; pointer-events: none; }

    #conversation-ui {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 24px 20px;
      background: linear-gradient(to top, rgba(10,10,18,0.92), rgba(10,10,18,0));
      color: #fff; font-family: system-ui, sans-serif; z-index: 20; display: none;
    }
    #conversation-ui.active { display: block; }
    #char-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    #interest-meter-track { width: 220px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
    #interest-meter-fill { height: 100%; width: 0%; background: #e0567c; transition: width 0.3s ease; }
    #transcript-line { min-height: 22px; font-size: 14px; color: #ccc; margin-bottom: 6px; }
    #her-line { min-height: 24px; font-size: 16px; margin-bottom: 10px; }
    #mic-controls { display: flex; gap: 10px; align-items: center; }
    #mic-btn {
      padding: 10px 18px; border-radius: 20px; border: none; background: #e0567c; color: #fff;
      font-size: 14px; cursor: pointer;
    }
    #mic-btn.listening { background: #ff2d55; }
    #mic-status { font-size: 12px; color: #aaa; user-select: none; }

    #fade-overlay {
      position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none;
      transition: opacity 0.9s ease; z-index: 45;
    }
    #fade-overlay.active { opacity: 1; }

    #stats-btn {
      position: absolute; top: 12px; right: 12px; z-index: 10; padding: 8px 14px;
      background: rgba(255,255,255,0.12); color: #fff; border: none; border-radius: 8px;
      font-family: system-ui, sans-serif; font-size: 13px; cursor: pointer;
    }
    #stats-panel {
      position: absolute; inset: 0; background: rgba(10,10,18,0.96); color: #fff;
      font-family: system-ui, sans-serif; z-index: 40; display: none; padding: 40px;
      overflow-y: auto;
    }
    #stats-panel.active { display: block; }
    .stats-row { display: flex; justify-content: space-between; max-width: 480px; padding: 10px 0; border-bottom: 1px solid #333; }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading-screen">
      <div>Waking up the world…</div>
      <div id="loading-status">Connecting to backend</div>
    </div>

    <div id="hud">WASD to move · walk up to a character to talk</div>
    <button id="stats-btn">Relationships</button>

    <div id="conversation-ui">
      <div id="char-name"></div>
      <div id="interest-meter-track"><div id="interest-meter-fill"></div></div>
      <div id="transcript-line"></div>
      <div id="her-line"></div>
      <div id="mic-controls">
        <button id="mic-btn">Tap to talk</button>
        <span id="mic-status"></span>
      </div>
    </div>

    <div id="stats-panel">
      <h2>Relationships</h2>
      <div id="stats-list"></div>
      <button id="stats-close">Close</button>
    </div>

    <div id="fade-overlay"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
